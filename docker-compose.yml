services:
  bluex:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/bxtaha/bluex:latest
    container_name: bluex
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      ELEVENLABS_AGENT_PHONE_NUMBER_ID: ${ELEVENLABS_AGENT_PHONE_NUMBER_ID:-}
      ELEVENLABS_CALL_TRANSPORT: ${ELEVENLABS_CALL_TRANSPORT:-twilio}
      ELEVENLABS_WEBHOOK_SECRET: ${ELEVENLABS_WEBHOOK_SECRET:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bluex.rule=Host(`bluex.agency`) || Host(`www.bluex.agency`)"
      - "traefik.http.routers.bluex.entrypoints=websecure"
      - "traefik.http.routers.bluex.tls.certresolver=letsencrypt"
      - "traefik.http.services.bluex.loadbalancer.server.port=3000"
